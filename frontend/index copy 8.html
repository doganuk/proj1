<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Flight Search</title>
</head>
<body class="bg-gray-100 p-8">
    <div x-data="{
        flights: [],
        defaultDate: '2024-03-10',
        departureDate: '2024-03-10',
        arrivalDate: '2024-03-10',
        
        formatDate(date) {
            return new Date(date).toLocaleDateString('en-US', {
                weekday: 'short',
                day: 'numeric',
                month: 'short'
            });
        },

        async fetchFlights() {
            const response = await fetch('https://zzzudod6mdgw7qjygmxio4ey5y0tndwh.lambda-url.eu-central-1.on.aws/list-flight/1');
            this.flights = await response.json();
        },
        
        changeDate(type, direction) {
            const currentDate = new Date(type === 'departure' ? this.departureDate : this.arrivalDate);
            currentDate.setDate(currentDate.getDate() + (direction === 'next' ? 1 : -1));
            if (type === 'departure') {
                this.departureDate = currentDate.toISOString().split('T')[0];
                this.filterByDate(this.departureDate, 'departure');
            } else {
                this.arrivalDate = currentDate.toISOString().split('T')[0];
                this.filterByDate(this.arrivalDate, 'arrival');
            }
        },

        filterByDate(date, type) {
            this.fetchFlights().then(() => {
                const selectedDate = new Date(date);
                this.flights = this.flights.filter(flight => {
                    const flightDate = new Date(flight[type === 'departure' ? 'departure_dt' : 'arrival_dt']);
                    return flightDate.toDateString() === selectedDate.toDateString();
                });
            });
        }
    }" x-init="fetchFlights()">
        
        <!-- Calendar Controls -->
        <div class="flex flex-col space-y-4 mb-8">
            <!-- Departure Calendar -->
            <div class="flex items-center space-x-4 bg-white p-4 rounded-lg shadow">
                <i class="fas fa-calendar text-gray-500"></i>
                <input type="text" 
                    x-model="formatDate(departureDate)" 
                    class="flex-grow border-none focus:outline-none"
                    readonly>
                <div class="flex space-x-2">
                    <button @click="changeDate('departure', 'prev')" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button @click="changeDate('departure', 'next')" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <!-- Arrival Calendar -->
            <div class="flex items-center space-x-4 bg-white p-4 rounded-lg shadow">
                <i class="fas fa-calendar text-gray-500"></i>
                <input type="text" 
                    x-model="formatDate(arrivalDate)" 
                    class="flex-grow border-none focus:outline-none"
                    readonly>
                <div class="flex space-x-2">
                    <button @click="changeDate('arrival', 'prev')" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button @click="changeDate('arrival', 'next')" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Flight Cards -->
        <div class="space-y-4">
            <template x-for="flight in flights" :key="flight.id">
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="text-lg font-semibold" x-text="flight.airline"></h3>
                            <p class="text-gray-600" x-text="'Flight ' + flight.id"></p>
                        </div>
                        <div class="text-right">
                            <p class="text-2xl font-bold" x-text="'€' + flight.price"></p>
                            <p class="text-sm text-gray-500" x-text="flight.number_of_stops + ' stops'"></p>
                        </div>
                    </div>
                    <div class="mt-4 flex justify-between">
                        <div>
                            <p class="text-sm text-gray-500">From</p>
                            <p class="font-semibold" x-text="flight.source"></p>
                            <p class="text-sm" x-text="new Date(flight.departure_dt).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'})"></p>
                        </div>
                        <div class="text-right">
                            <p class="text-sm text-gray-500">To</p>
                            <p class="font-semibold" x-text="flight.sink"></p>
                            <p class="text-sm" x-text="new Date(flight.arrival_dt).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'})"></p>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>
</body>
</html>
