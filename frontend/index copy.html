<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Flight Search</title>
</head>
<body class="bg-gray-100 p-8">
    <div x-data="{
        flights: [],
        departureDate: '2024-03-10',
        arrivalDate: '2024-03-10',
        
        formatDate(date) {
            return new Date(date).toLocaleDateString('en-US', {
                weekday: 'short',
                day: 'numeric',
                month: 'short'
            });
        },

        async fetchFlights() {
            const response = await fetch('https://zzzudod6mdgw7qjygmxio4ey5y0tndwh.lambda-url.eu-central-1.on.aws/list-flight/1');
            this.flights = await response.json();
        },
        
        filterFlights() {
            const depDate = new Date(this.departureDate);
            const arrDate = new Date(this.arrivalDate);
            
            return this.flights.filter(flight => {
                const flightDepDate = new Date(flight.departure_dt);
                const flightArrDate = new Date(flight.arrival_dt);
                console.log('asd');
                console.log(flightArrDate);
                return flightDepDate.toDateString() === depDate.toDateString() &&
                       flightArrDate.toDateString() === arrDate.toDateString();
            });
        },

        changeDate(type, increment) {
            const date = new Date(type === 'departure' ? this.departureDate : this.arrivalDate);
            date.setDate(date.getDate() + increment);
            if (type === 'departure') {
                this.departureDate = date.toISOString().split('T')[0];
            } else {
                this.arrivalDate = date.toISOString().split('T')[0];
            }
        }
    }" x-init="fetchFlights()">
        
        <!-- Calendar Controls -->
        <div class="flex space-x-4 mb-8">
            <!-- Departure Calendar -->
            <div class="flex items-center bg-white rounded-lg shadow p-3">
                <i class="fas fa-calendar text-gray-500 mr-3"></i>
                <input type="date" 
                       x-model="departureDate"
                       class="mr-3"
                       :value="departureDate">
                <div class="flex space-x-2">
                    <button @click="changeDate('departure', -1)" 
                            class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button @click="changeDate('departure', 1)" 
                            class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                <div class="ml-3 text-gray-600" x-text="formatDate(departureDate)"></div>
            </div>

            <!-- Arrival Calendar -->
            <div class="flex items-center bg-white rounded-lg shadow p-3">
                <i class="fas fa-calendar text-gray-500 mr-3"></i>
                <input type="date" 
                       x-model="arrivalDate"
                       class="mr-3"
                       :value="arrivalDate">
                <div class="flex space-x-2">
                    <button @click="changeDate('arrival', -1)" 
                            class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button @click="changeDate('arrival', 1)" 
                            class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                <div class="ml-3 text-gray-600" x-text="formatDate(arrivalDate)"></div>
            </div>
        </div>

        <!-- Flight Cards -->
        <div class="space-y-4">
            <template x-for="flight in filterFlights()" :key="flight.id">
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="text-xl font-bold" x-text="flight.airline"></div>
                            <div class="text-gray-600" x-text="'Flight ' + flight.id"></div>
                        </div>
                        <div class="text-right">
                            <div class="text-2xl font-bold" x-text="'$' + flight.price"></div>
                            <div class="text-gray-600" x-text="flight.number_of_stops + ' stops'"></div>
                        </div>
                    </div>
                    <div class="mt-4 flex justify-between">
                        <div>
                            <div class="font-semibold" x-text="flight.source + ' → ' + flight.sink"></div>
                            <div class="text-gray-600">
                                <span x-text="new Date(flight.departure_dt).toLocaleTimeString()"></span>
                                -
                                <span x-text="new Date(flight.arrival_dt).toLocaleTimeString()"></span>
                            </div>
                        </div>
                        <div class="text-gray-600">
                            <div x-text="'Emissions: ' + flight.emissions + 'g CO2'"></div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>
</body>
</html>
