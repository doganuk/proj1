<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <title>Document</title>
</head>
<body class="bg-gray-100 p-8">
    <div x-data="{ 
        flights: [],
        sourceCity: 'London',
        destinationCity: 'Amsterdam',
        selectedAirline: '',
        selectedStops: '',
        airlines: [],
        stopOptions: [0, 1, 2, 3]
    }" 
    x-init="fetch('https://zzzudod6mdgw7qjygmxio4ey5y0tndwh.lambda-url.eu-central-1.on.aws/list-flight/1')
        .then(response => response.json())
        .then(data => {
            flights = data;
            airlines = [...new Set(data.map(flight => flight.airline))];
        })">

        <!-- Search Controls -->
        <div class="max-w-4xl mx-auto mb-8 space-y-4">
            <div class="flex gap-4 items-center justify-center mb-4">
                <input type="text" x-model="sourceCity" class="p-2 border rounded w-1/3">
                <button @click="[sourceCity, destinationCity] = [destinationCity, sourceCity]" 
                    class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    ⇄
                </button>
                <input type="text" x-model="destinationCity" class="p-2 border rounded w-1/3">
            </div>

            <div class="flex gap-4 justify-center">
                <select x-model="selectedAirline" class="p-2 border rounded w-1/3">
                    <option value="">All Airlines</option>
                    <template x-for="airline in airlines">
                        <option x-text="airline" :value="airline"></option>
                    </template>
                </select>

                <select x-model="selectedStops" class="p-2 border rounded w-1/3">
                    <option value="">All Stops</option>
                    <template x-for="stop in stopOptions">
                        <option x-text="stop + ' Stop(s)'" :value="stop"></option>
                    </template>
                </select>
            </div>
        </div>

        <!-- Flight List -->
        <div class="max-w-4xl mx-auto space-y-4">
            <template x-for="flight in flights.filter(f => 
                (!selectedAirline || f.airline === selectedAirline) &&
                (!selectedStops || f.number_of_stops === parseInt(selectedStops)) &&
                (f.source === sourceCity && f.sink === destinationCity))" 
                :key="flight.id">
                <div class="bg-white p-4 rounded-lg shadow-md hover:shadow-lg transition-shadow">
                    <div class="flex justify-between items-center">
                        <div class="space-y-2">
                            <div class="font-bold text-lg" x-text="flight.airline"></div>
                            <div class="text-gray-600">
                                <span x-text="flight.departure_dt"></span> → 
                                <span x-text="flight.arrival_dt"></span>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-xl text-blue-600" x-text="'€' + flight.price"></div>
                            <div class="text-sm text-gray-500" x-text="flight.number_of_stops + ' Stop(s)'"></div>
                            <div class="text-xs text-gray-400" x-text="flight.emissions + ' kg CO2'"></div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>
</body>
</html>
